name: release

# 打 tag（形如 v1.2）即发布：把 dist/ 里已经签好名的安装包挂到 Releases。
# 不在 CI 里编译——签名密钥不进仓库，出包仍在本地做，CI 只负责分发。
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验安装包
        run: |
          VER="${GITHUB_REF_NAME#v}"
          APK="dist/Snake-v${VER}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::缺少 $APK，请先把本地构建好的安装包提交到 dist/"
            exit 1
          fi
          ( cd dist && sha256sum -c SHA256SUMS.txt )
          echo "APK=$APK" >> "$GITHUB_ENV"

      # tag 对象在 CI checkout 里不可靠（可能被 fetch 成轻量标签），
      # 发布正文一律从仓库里的 .github/releases/<tag>.md 取，可评审、可追溯。
      - name: 定位发布正文
        run: |
          NOTES=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          else
            echo "NOTES=" >> "$GITHUB_ENV"
            echo "::warning::没有 $NOTES，退回自动生成 changelog"
          fi

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_arg=(--generate-notes)
          if [ -n "$NOTES" ]; then notes_arg=(--notes-file "$NOTES"); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 重跑（比如改了正文或重出包）也要收敛到期望状态
            gh release edit "$GITHUB_REF_NAME" --title "Snake ${GITHUB_REF_NAME}" "${notes_arg[@]}"
            gh release upload "$GITHUB_REF_NAME" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" dist/SHA256SUMS.txt \
              --title "Snake ${GITHUB_REF_NAME}" "${notes_arg[@]}" --latest
          fi
